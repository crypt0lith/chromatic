[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "chromatic-python"
dynamic = ["version"]
description = "ANSI art image processing and colored terminal text"
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["ansi", "ascii", "art", "font", "image", "terminal", "parser"]
authors = [{ name = "crypt0lith" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1,<2.8",
    "pillow>=12.2.0",
    "scipy>=1.11.4",
    "opencv-python",
    "fonttools>=4.60.2",
    "lazy_loader",
]

[project.urls]
repository = "https://github.com/crypt0lith/chromatic.git"

[project.scripts]
chromatic = "chromatic.__main__:main"

[tool.setuptools_scm]
write_to = "chromatic/_version.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["chromatic*"]

[tool.setuptools.package-data]
chromatic = ["data/fonts/*", "data/images/*"]

[tool.black]
preview = true
skip-magic-trailing-comma = true
target-version = ["py313"]

[tool.isort]
profile = "black"
split_on_trailing_comma = false
combine_as_imports = true

[tool.pyright]
pythonPlatform = "All"
